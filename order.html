<!DOCTYPE html>
<html lang="en">

<head>
    <title>CONFIRM ORDER</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width , initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color:#a09dca ;">
    <h1>COMPLETE YOUR ORDER</h1>
    <hr class="line">

    <img id="productimg" class="pro-img" src="">
    <div id="productprice" class="pro-price"></div>
    <section class="container">
        <form id="form">
            <div class="options">
                <h3>choose a color</h3>
                <label class="click"><input type="radio" name="color" value="pink">PINK</label>
                <label class="click"><input type="radio" name="color" value="blue">BLUE</label>
            </div> <br>
            <div class="options">
                <label class="click"><input type="radio" name="size" value="S">S</label>
                <label class="click"><input type="radio" name="size" value="M">M</label>
                <label class="click"><input type="radio" name="size" value="L">L</label>
                <label class="click"><input type="radio" name="size" value="XL">XL</label>

            </div>
            <div class="info">
                <h3>full name</h3>
                <input type="text" id="name" placeholder="enter your name" required>

                <h3>phone number</h3>
                <input type="tel" id="number" placeholder="enter your number" required>

                <h3>wilaya</h3>
                <select id="wilaya" required onchange="updateshipp()">
                    <option value="BATNA">BATNA</option>
                    <option value="BISKRA">BISKRA</option>
                    <option value="SETIF">SETIF</option>
                    <option value="ALGEIRS">ALGEIRS</option>
                    <option value="ORAN">ORAN</option>
                </select>

                <h3>delivery place</h3>

                <select id="delivery" required onchange="updateshipp()">
                    <option value="HOME">HOME</option>
                    <option value="OFFICE">OFFICE</option>
                </select>


                <div class="delprice">
                    <div>delivery price : <strong id="shipprice">0 DA</strong></div>
                    <div>total price : <strong id="totalprice">0 DA</strong>
                    </div>
                </div>
            </div>
            <button type="submit" class="sbm">confirm order</button>

        </form>
    </section>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const imgSrc = urlParams.get('img');
        const basePrice = parseInt(urlParams.get('price')) || 0;

        document.getElementById('productimg').src = imgSrc;
        document.getElementById('productprice').innerText = basePrice + " DA";
        document.getElementById('totalPrice').innerText = basePrice + " DA";

        const rates = {
            oran: {home: 700, desk: 600},
            batna: {home: 600, desk: 500},
            setif: {home: 700, desk: 600},
            biskra: {home: 600, desk: 500},
        };

        function updateShipp() {
            const wilaya = document.getElementById('wilaya').value;
            const deliveryType = document.getElementById('delivery').value;

            if (!wilaya) {
                document.getElementById('shippPrice').innerText = "0 DA";
                document.getElementById('totalPrice').innerText = basePrice + " DA";
                return;
            }

            const shippCost = rates[wilaya][deliveryType];
            const total = baseprice + shippCost;

            document.getElementById('shippPrice').innerText = shippCost + " DA";
            document.getElementById('totalPrice').innerText = total + " DA";
        }

        document.getElementById('orderForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const color = document.querySelector('input[name="color"]:checked').value;
            const size = document.querySelector('input[name="size"]:checked').value;
            const fullname = document.getElementById('fullname').value;
            const phone = document.getElementById('phone').value;
            const wilaya = document.getElementById('wilaya').options[document.getElementById('wilaya').selectedIndex].text;
            const delivery = document.getElementById('delivery').options[document.getElementById('delivery').selectedIndex].text;
            const totalPrice = document.getElementById('totalPrice').innerText;
            const productimgSrc = document.getElementById('productimg').src;
        });
    </script>
</body>

</html>
